# @package _group_
#
# Short RunAI smoke for transformer signal-reconstruction.
#
# BASELINE: spectralfm_full_train (the standard SpectralFM pretraining recipe).
#   We inherit:
#     - model arch (data2vec_audio, layer_norm extractor, mask_prob 0.4, EMA, etc.)
#     - task (audio_pretraining, normalize=true, max_sample_size=500, min=200)
#     - common.fp16, log_format, tensorboard_logdir
#     - criterion._name = model (with target_var / pred_var / ema_decay log_keys)
#     - single AdamW optimizer + cosine LR scheduler (no composite optimizer here)
#
# SMOKE OVERRIDES (this file):
#   - 1 GPU, batch_size=16, max_update=100, max_epoch=100, warmup=10
#   - W&B project = spectralfm-runai-signal-recon (per user spec)
#   - data = /storage/.../single_channel_100  (RunAI; never /mnt5)
#   - Add recon-loss log_keys (regression / loss_recon_fe / loss_recon_trans)
#   - Init FE + LN + proj + transformer from base_libri_official.pt
#   - Freeze EVERYTHING except transformer + trans_recon_decoder
#   - lambda_recon_trans=1.0, lambda_recon_fe=0.0 (FE branch off, still logged)
#   - recon_decoder_type=mirror (MirrorReconDecoder)
#   - LR=1e-5 for everything (only transformer+decoder have grads anyway)
#
# CLI overrides in submit_signal_recon_hydra_short_runai.sh pin: hydra.run.dir,
# checkpoint.save_dir, optimization.max_update/epoch, and all model.* fields,
# because `# @package _group_` doesn't reliably deep-merge top-level blocks
# across `defaults:` imports — CLI overrides always win.

defaults:
  - ../spectralfm_full_train

common:
  fp16: false
  log_interval: 10
  wandb_project: "spectralfm-runai-signal-recon"
  # Self-describing run name; uses the get_data_size resolver registered in
  # fairseq.dataclass.initialize. Short tag for the smoke.
  wandb_run_name: "tr_signal_short_lr${optimization.lr[0]}_${get_data_size:${task.data}}_${now:%Y%m%d_%H%M}"

checkpoint:
  save_interval_updates: 50
  keep_interval_updates: 2
  no_epoch_checkpoints: true

task:
  data: /storage/noy/SpectralFM/fairseq/data/nova_data/single_channel_100

dataset:
  num_workers: 2
  batch_size: 16
  disable_validation: true
  max_tokens: null

distributed_training:
  distributed_world_size: 1
  ddp_backend: legacy_ddp

criterion:
  _name: model
  log_keys:
    - ema_decay
    - target_var
    - pred_var
    - regression
    - loss_recon_fe
    - loss_recon_trans

optimization:
  max_update: 100
  max_epoch: 100
  lr: [1.0e-5]
  update_freq: [1]
  clip_norm: 1.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: cosine
  warmup_updates: 10

model:
  _name: data2vec_audio

  # Recon-loss specific fields (added by recon_loss work; not in baseline).
  recon_only: false
  recon_loss_type: l2
  lambda_recon_fe: 0.0
  lambda_recon_trans: 1.0
  recon_decoder_type: mirror
  recon_output_dim: 245
  recon_decoder_hidden: "512"

  # Disable full-checkpoint load; per-component init below replaces it.
  model_path: null
  skip_pretrained_weights: true

  # Init from base_libri (shape-safe; FE may skip, transformer loads compatible layers).
  init_fe_ckpt:          /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_ln_ckpt:          /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_proj_ckpt:        /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_transformer_ckpt: /storage/noy/SpectralFM/fairseq/base_libri_official.pt

  # Freeze EVERYTHING except transformer + trans_recon_decoder.
  freeze_fe_v2: true
  freeze_ln: true
  freeze_proj: true
  freeze_fe_recon_decoder: true
  freeze_mask_emb: true
  freeze_final_proj: true
  freeze_transformer_v2: false
  freeze_trans_recon_decoder: false

  # No composite optimizer here (single Adam); param-group tagging is harmless
  # but unnecessary, so leave it off.
  tag_param_groups: false

  # Smoke skips the epoch-cosim monitor.
  epoch_cosim_enable: false

hydra:
  run:
    dir: /storage/noy/SpectralFM/fairseq/outputs/recon_loss/${now:%Y-%m-%d_%H-%M-%S}_tr_signal_short
  sweep:
    dir: /storage/noy/SpectralFM/fairseq/outputs/recon_loss
