# @package _group_
#
# Short RunAI smoke: transformer + trans_recon_decoder trainable; everything else frozen.
# Init all compatible blocks from base_libri_official.pt; LR 1e-5 on the transformer group
# (encoder + trans_recon_decoder). Logs regression (EMA) + recon_trans to W&B.
#
# Override paths on RunAI: task.data, init_*_ckpt, common.user_dir, hydra.run.dir → /storage/...

defaults:
  - spectralfm_recon_loss_basemerge

common:
  log_interval: 10
  wandb_project: "spectralfm-runai-signal-recon"
  wandb_run_name: "tr_signal_short_${now:%Y%m%d_%H%M}"

checkpoint:
  save_interval_updates: 50
  keep_interval_updates: 1
  no_epoch_checkpoints: true

task:
  data: /storage/noy/SpectralFM/fairseq/data/nova_data/single_channel_100/wav
  max_sample_size: 500
  min_sample_size: 200

dataset:
  batch_size: 16
  num_workers: 2
  disable_validation: true
  max_tokens: null

optimization:
  max_update: 100
  max_epoch: 1
  update_freq: [1]

lr_scheduler:
  warmup_updates: 10
  max_update: 100

optimizer:
  _name: composite
  groups:
    fe:
      lr: [1e-5]
      optimizer: {_name: adam, adam_betas: (0.9,0.98), adam_eps: 1e-06, weight_decay: 0.01}
      lr_scheduler: {_name: cosine, warmup_updates: 10, max_update: 100}
    ln:
      lr: [1e-5]
      optimizer: {_name: adam, adam_betas: (0.9,0.98), adam_eps: 1e-06, weight_decay: 0.0}
      lr_scheduler: {_name: cosine, warmup_updates: 10, max_update: 100}
    proj:
      lr: [1e-4]
      optimizer: {_name: adam, adam_betas: (0.9,0.98), adam_eps: 1e-06, weight_decay: 0.01}
      lr_scheduler: {_name: cosine, warmup_updates: 10, max_update: 100}
    transformer:
      lr: [1e-5]
      optimizer: {_name: adam, adam_betas: (0.9,0.98), adam_eps: 1e-06, weight_decay: 0.01}
      lr_scheduler: {_name: cosine, warmup_updates: 10, max_update: 100}
    other:
      lr: [1e-4]
      optimizer: {_name: adam, adam_betas: (0.9,0.98), adam_eps: 1e-06, weight_decay: 0.01}
      lr_scheduler: {_name: cosine, warmup_updates: 10, max_update: 100}

model:
  recon_only: false
  recon_loss_type: l2
  lambda_recon_fe: 0.0
  lambda_recon_trans: 1.0
  recon_decoder_type: mirror

  model_path: null
  skip_pretrained_weights: true

  # Init all blocks from base_libri (FE may shape-skip; transformer loads 8/12 layers).
  init_fe_ckpt:          /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_ln_ckpt:          /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_proj_ckpt:        /storage/noy/SpectralFM/fairseq/base_libri_official.pt
  init_transformer_ckpt: /storage/noy/SpectralFM/fairseq/base_libri_official.pt

  # Freeze everything except transformer encoder + trans_recon_decoder.
  freeze_fe_v2: true
  freeze_ln: true
  freeze_proj: true
  freeze_fe_recon_decoder: true
  freeze_mask_emb: true
  freeze_final_proj: true
  freeze_transformer_v2: false
  freeze_trans_recon_decoder: false

  tag_param_groups: true

hydra:
  run:
    dir: /storage/noy/SpectralFM/fairseq/outputs/recon_loss/${now:%Y-%m-%d_%H-%M-%S}_tr_signal_short
  sweep:
    dir: /storage/noy/SpectralFM/fairseq/outputs/recon_loss
