# @package _group_
# SpectralFM pretraining config.
# Based on base_librispeech.yaml but tuned for short 1D spectrograms (245 frames per sample).

common:
  fp16: true
  log_format: json
  log_interval: 10
  tensorboard_logdir: tb

checkpoint:
  save_interval: 5
  save_interval_updates: 5000
  keep_interval_updates: 3
  no_epoch_checkpoints: true

task:
  _name: audio_pretraining
  data: ???                  # override at launch: task.data=/path/to/manifest/dir
  max_sample_size: 1000      # SpectralFM wavs are 245 frames — well under this cap
  min_sample_size: 1         # must be 1; base_librispeech uses 32000 which filters everything
  normalize: true

dataset:
  num_workers: 4
  max_tokens: 400000         # scaled down from 3.8M (samples are tiny)
  skip_invalid_size_inputs_valid_test: true
  validate_interval: 5
  required_batch_size_multiple: 1
  disable_validation: false

distributed_training:
  distributed_world_size: 1  # override at launch for multi-GPU
  ddp_backend: legacy_ddp

criterion:
  _name: model
  log_keys:
    - ema_decay
    - target_var
    - pred_var
    - post_extract_in_mean
    - post_extract_in_std
    - post_extract_out_mean
    - post_extract_out_std

optimization:
  max_update: 400000
  lr: [0.0001]

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-06
  weight_decay: 0.01

lr_scheduler:
  _name: tri_stage
  phase_ratio: [0.03, 0.9, 0.07]

model:
  _name: data2vec_audio
  extractor_mode: layer_norm
  encoder_layerdrop: 0.05
  dropout_input: 0.0
  dropout_features: 0.0
  feature_grad_mult: 1.0
  encoder_embed_dim: 768

  mask_prob: 0.65
  mask_length: 1             # span=1 since our sequences are only 49 tokens after conv

  loss_beta: 0
  loss_scale: null

  instance_norm_target_layer: true
  average_top_k_layers: 8

  pos_conv_depth: 5
  conv_pos: 95

  ema_decay: 0.999
  ema_end_decay: 0.9999
  ema_anneal_end_step: 30000
  ema_transformer_only: true
  ema_layers_only: true

  require_same_masks: true
  mask_dropout: 0

  post_extract_proj_type: linear
  post_extract_proj_mlp_hidden: 1536

  # explicit: the merged-in autoencoder branch added a `train_only_fe` gate
  # that defaults to True (freezes everything except the feature extractor).
  # This config trains the full model end-to-end, so it must override that.
  train_only_fe: false
