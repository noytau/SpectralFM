################################################################################
# TRAINING EXPERIMENTS – SWEEP + PRESETS
################################################################################

# Set a preset for a single-run.
# Leave null to use full sweep permutations.
preset: null


################################################################################
# SWEEP PARAMETERS
################################################################################

epoch:
  - 1
  - 2
  - 3

batch_size:
  - 8
  - 16
  - 32

mask_ratio:
  - 0.25
  - 0.40
  - 0.50

lr_scheduler:
  - polynomial_decay
  - cosine
  - inverse_sqrt

dataset:
  - single_channel_1m
  - single_channel_5m
  - single_channel_10m
  - multi_channel


################################################################################
# W&B LOGGING
################################################################################

hydra:
  job:
    env_set:
      WANDB_PROJECT: train_feature_extractor_only
      WANDB_NAME: train_fe_${hydra.job.num}


