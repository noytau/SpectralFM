# experiments/base.yaml

defaults:
  - /config/audio/pretraining/base_librispeech  # <<---- Fairseq base
  - preset: null                                # <<---- preset group

hydra:
  job:
    env_set:
      WANDB_PROJECT: train_feature_extractor_only

# These override the base_librispeech fields
epoch: 1
batch_size: 8
mask_ratio: 0.25
lr_scheduler: polynomial_decay
dataset: single_channel_1m

task:
  data: ${dataset}

optimization:
  max_epoch: ${epoch}
  lr_scheduler: ${lr_scheduler}

model:
  mask_ratio: ${mask_ratio}
  batch_size: ${batch_size}
