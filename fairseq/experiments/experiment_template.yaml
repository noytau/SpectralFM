# experiment.yaml

defaults:
  - /mnt5/noy/fairseq/examples/data2vec/config/audio/pretraining/base_librispeech

hydra:
  job:
    env_set:
      WANDB_PROJECT: train_feature_extractor_only

################################################################################
# OVERRIDABLE VALUES — MUST BE NESTED INSIDE VALID FAIRSEQ KEYS
################################################################################

# Optimizer configuration
optimizer:
  lr: [0.001]
  weight_decay: 0.0

# LR scheduler
lr_scheduler:
  _name: polynomial_decay

# Model parameters
model:
  batch_size: 8
  mask_ratio: 0.25

# Dataset
task:
  data: single_channel_1m
