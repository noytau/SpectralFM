################################################################################
# EXPERIMENT – single_channel_1m WITH INTERNAL PRESETS
################################################################################

defaults:
  - base  # imports your base.yaml

# Which preset to use (null = use base.yaml defaults)
preset_name: null

# Override the dataset for this experiment
dataset: single_channel_1m


################################################################################
# PRESETS (INLINE)
################################################################################

preset_overrides:

  run1:
    epoch: 1
    batch_size: 8
    mask_ratio: 0.25
    lr_scheduler: cosine

  run2:
    epoch: 1
    batch_size: 32
    mask_ratio: 0.40
    lr_scheduler: polynomial_decay

  run3:
    epoch: 2
    batch_size: 16
    mask_ratio: 0.35
    lr_scheduler: inverse_sqrt

  run4:
    epoch: 2
    batch_size: 16
    mask_ratio: 0.50
    lr_scheduler: cosine

  run5:
    epoch: 3
    batch_size: 32
    mask_ratio: 0.30
    lr_scheduler: polynomial_decay


################################################################################
# LOGIC: SELECT BETWEEN BASE.YAML AND PRESET
################################################################################

apply:
  epoch:        ${preset_overrides.${preset_name}.epoch,       ${epoch}}
  batch_size:   ${preset_overrides.${preset_name}.batch_size,  ${batch_size}}
  mask_ratio:   ${preset_overrides.${preset_name}.mask_ratio,  ${mask_ratio}}
  lr_scheduler: ${preset_overrides.${preset_name}.lr_scheduler,${lr_scheduler}}
  dataset:      ${dataset}  # dataset always overridden here


################################################################################
# FINAL FAIRSEQ CONFIG (CLEAN)
################################################################################

task:
  data: ${apply.dataset}

optimization:
  max_epoch:    ${apply.epoch}
  lr_scheduler: ${apply.lr_scheduler}
  lr: 0.0015
  max_update: 0

model:
  mask_ratio:   ${apply.mask_ratio}
  batch_size:   ${apply.batch_size}


################################################################################
# W&B
################################################################################

hydra:
  job:
    env_set:
      WANDB_PROJECT: train_feature_extractor_only
      WANDB_NAME: sc1m_${preset_name}_${hydra.job.num}
